<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Raspberry Stempeluhr</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body class="kiosk">
    <h1>Stempeluhr</h1>

    <div id="autoInfo" class="auto-info">
        {% if pending_rfid_employee %}
        RFID-Lernmodus aktiv: Chip für {{ pending_rfid_employee.first_name }} {{ pending_rfid_employee.last_name }} scannen.
        {% else %}
        RFID scannen. Danach {{ auto_delay_seconds|default(3) }} Sekunden Zeit für Auswahl.
        {% endif %}
    </div>

    <form action="/book" method="post" class="kiosk-form" id="manualForm">
        <input type="hidden" name="return_to" value="/raspberry">
        <input name="rfid_code" id="rfidInput" class="rfid-input" autofocus autocomplete="off" placeholder="RFID scannen">

        <div id="reasonArea" style="display:none;margin-top:8px;">
            <label for="reasonSelect" style="margin:0 0 4px;font-size:16px;">Stempelgrund (optional)</label>
            <select id="reasonSelect" style="height:42px;padding:6px;font-size:16px;margin:0;">
                <option value="0">Automatisch Kommen / Gehen</option>
            </select>
        </div>

        <div class="kiosk-buttons">
            <button name="entry_type" value="kommen">Kommen</button>
            <button name="entry_type" value="gehen" class="danger">Gehen</button>
            <button name="entry_type" value="pause_start">Pause Start</button>
            <button name="entry_type" value="pause_ende" class="warn">Pause Ende</button>
        </div>
    </form>

    <form action="/raspberry/reason-scan" method="post" id="autoForm" style="display:none;">
        <input name="rfid_code" id="autoRfidInput">
        <input name="reason_id" id="autoReasonId" value="0">
    </form>

    <div class="kiosk-links">
        <a href="/admin">Admin</a>
        <a href="/reports">Auswertung</a>
        <a href="/corrections">Korrektur</a>
    </div>

<script>
const AUTO_DELAY_SECONDS = {{ auto_delay_seconds|default(3) }};
const AUTO_DELAY_MS = AUTO_DELAY_SECONDS * 1000;
const input = document.getElementById("rfidInput");
const manualForm = document.getElementById("manualForm");
const autoForm = document.getElementById("autoForm");
const autoRfidInput = document.getElementById("autoRfidInput");
const autoReasonId = document.getElementById("autoReasonId");
const autoInfo = document.getElementById("autoInfo");
const reasonArea = document.getElementById("reasonArea");
const reasonSelect = document.getElementById("reasonSelect");
const terminalCode = new URLSearchParams(window.location.search).get("terminal_code") || "";

let autoTimer = null;
let countdownTimer = null;
let inputPauseTimer = null;
let remaining = AUTO_DELAY_SECONDS;
let learnActive = {{ 'true' if pending_rfid_employee else 'false' }};
let learnEmployeeName = "{% if pending_rfid_employee %}{{ pending_rfid_employee.first_name }} {{ pending_rfid_employee.last_name }}{% endif %}";
let manualSubmit = false;
let enrollmentRedirecting = false;

function clearAutoTimers() {
    if (autoTimer) clearTimeout(autoTimer);
    if (countdownTimer) clearInterval(countdownTimer);
    autoTimer = null;
    countdownTimer = null;
}

function setLearnStatus(active, name) {
    learnActive = active;
    learnEmployeeName = name || "";
    if (learnActive) {
        autoInfo.textContent = "RFID-Lernmodus aktiv: Chip für " + learnEmployeeName + " scannen.";
    } else if (!input.value.trim()) {
        autoInfo.textContent = "RFID scannen. Danach " + AUTO_DELAY_SECONDS + " Sekunden Zeit für Auswahl.";
    }
}

async function pollPluginEnrollment() {
    if (enrollmentRedirecting || document.hidden) return;
    try {
        const q = new URLSearchParams();
        if (terminalCode) q.set("terminal_code", terminalCode);
        const res = await fetch("/terminal/enrollment-state?" + q.toString(), {cache: "no-store"});
        if (!res.ok) return;
        const data = await res.json();
        if (data.status !== "active" || !data.plugin || !data.employee_id || !data.token) return;
        enrollmentRedirecting = true;
        clearAutoTimers();
        const p = new URLSearchParams({
            token: String(data.token),
            terminal_code: String(data.terminal_code || terminalCode || ""),
            seconds: String(data.seconds || 35)
        });
        window.location.replace(
            "/terminal/auth-enrollment/" + encodeURIComponent(data.plugin) + "/" +
            encodeURIComponent(data.employee_id) + "?" + p.toString()
        );
    } catch (e) {}
}

async function pollLearnStatus() {
    try {
        const res = await fetch("/api/rfid-learn/status", {cache: "no-store"});
        if (!res.ok) return;
        const data = await res.json();
        setLearnStatus(Boolean(data.active), data.employee ? data.employee.name : "");
    } catch (e) {}
}

async function loadReasons() {
    try {
        const response = await fetch('/api/stamp-reasons', {cache: 'no-store'});
        if (!response.ok) return;
        const data = await response.json();
        const reasons = data.reasons || [];
        if (!data.enabled || reasons.length === 0) return;
        for (const reason of reasons) {
            const option = document.createElement('option');
            option.value = String(reason.id);
            option.textContent = reason.name;
            reasonSelect.appendChild(option);
        }
        reasonArea.style.display = 'block';
    } catch (e) {}
}

function submitRfidScanNow(message) {
    const code = input.value.trim();
    if (!code) return;
    clearAutoTimers();
    autoRfidInput.value = code;
    autoReasonId.value = reasonSelect.value || "0";
    autoInfo.textContent = message || "RFID wird verarbeitet ...";
    autoForm.submit();
}

function startAutoBooking() {
    const code = input.value.trim();
    if (!code || manualSubmit) return;
    clearAutoTimers();

    if (learnActive) {
        submitRfidScanNow("RFID wird für " + learnEmployeeName + " gespeichert ...");
        return;
    }

    remaining = AUTO_DELAY_SECONDS;
    autoInfo.textContent = "RFID erkannt. Automatische Buchung in " + remaining + " Sekunden ...";
    countdownTimer = setInterval(() => {
        remaining -= 1;
        if (remaining > 0) autoInfo.textContent = "RFID erkannt. Automatische Buchung in " + remaining + " Sekunden ...";
    }, 1000);
    autoTimer = setTimeout(() => submitRfidScanNow("Automatische Buchung wird ausgeführt ..."), AUTO_DELAY_MS);
}

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        e.preventDefault();
        input.value = input.value.trim();
        startAutoBooking();
        return false;
    }
});

input.addEventListener("input", function() {
    if (inputPauseTimer) clearTimeout(inputPauseTimer);
    inputPauseTimer = setTimeout(() => {
        if (input.value.trim().length > 0) startAutoBooking();
    }, 500);
});

manualForm.querySelectorAll('button[name="entry_type"]').forEach(button => {
    button.addEventListener('click', function() {
        manualSubmit = true;
        clearAutoTimers();
    });
});

manualForm.addEventListener('submit', function() {
    manualSubmit = true;
    clearAutoTimers();
});

loadReasons();
pollLearnStatus();
pollPluginEnrollment();
setInterval(() => { if (!document.hidden) pollLearnStatus(); }, 5000);
setInterval(pollPluginEnrollment, 750);
window.addEventListener("load", () => input.focus());
document.addEventListener("click", () => input.focus());
</script>
</body>
</html>
