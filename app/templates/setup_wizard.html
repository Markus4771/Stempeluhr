{% extends "base.html" %}
{% block content %}
<h1>Einrichtungsassistent</h1>
<section class="card">
  <p>Der Assistent prüft die wichtigsten Grundfunktionen und führt durch die Ersteinrichtung.</p>
  <ol>
    <li>PostgreSQL prüfen</li><li>Administrator prüfen</li><li>E-Mail einrichten</li><li>Backup aktivieren</li><li>API aktivieren</li>
  </ol>
  <form method="post" action="/setup">
    <label><input type="checkbox" name="setup_completed" value="1" {% if settings.setup_completed == 'true' %}checked{% endif %}> Einrichtung abgeschlossen</label><br><br>
    <button class="button" type="submit">Speichern</button>
  </form>
</section>
{% endblock %}
