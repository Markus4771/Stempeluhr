{% extends "base.html" %}
{% block content %}
<h1>Neues Passwort vergeben</h1>

<section class="card login-card">
    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}
    {% if message %}
    <div class="success-box">{{ message }}</div>
    <p class="hint"><a href="/login">Zum Login</a></p>
    {% endif %}

    {% if token %}
    <form action="/password-reset/{{ token }}" method="post">
        <label>Neues Passwort</label>
        <input name="password" type="password" minlength="8" required autofocus>

        <label>Passwort wiederholen</label>
        <input name="password_repeat" type="password" minlength="8" required>

        <button class="full-button">Passwort speichern</button>
    </form>
    {% endif %}

    {% if not token and not message %}
    <p class="hint"><a href="/password-forgot">Neuen Link anfordern</a></p>
    {% endif %}
</section>
{% endblock %}
