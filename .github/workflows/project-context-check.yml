name: Projektkontext prüfen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  context-check:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Versionsdateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -f version.txt
          test -f app/version.py
          test -f README.md
          test -f changelog.md
          test -f CHATGPT_PROJEKTKONTEXT.md
          test -f NEUER_CHAT.md
          test -f debian/control

          if [ -f VERSION ]; then
            echo "Die veraltete zweite Versionsdatei VERSION darf nicht existieren."
            exit 1
          fi

          VERSION="$(tr -d '[:space:]' < version.txt)"

          if [ -z "$VERSION" ]; then
            echo "version.txt ist leer."
            exit 1
          fi

          APP_VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('app/version.py').read_text(encoding='utf-8')
          match = re.search(r'^APP_VERSION\s*=\s*["\x27]([^"\x27]+)["\x27]', text, re.MULTILINE)
          if not match:
              raise SystemExit('APP_VERSION wurde in app/version.py nicht gefunden.')
          print(match.group(1))
          PY
          )"

          DEB_VERSION="$(awk -F': *' '$1 == "Version" {print $2; exit}' debian/control | tr -d '[:space:]')"

          echo "Prüfe Dokumentation, Anwendung und Debian-Paket für Version $VERSION"

          if [ "$APP_VERSION" != "$VERSION" ]; then
            echo "Versionskonflikt: version.txt=$VERSION, app/version.py=$APP_VERSION"
            exit 1
          fi

          if [ "$DEB_VERSION" != "$VERSION" ]; then
            echo "Versionskonflikt: version.txt=$VERSION, debian/control=$DEB_VERSION"
            exit 1
          fi

          grep -Fq "$VERSION" README.md || {
            echo "README.md enthält Version $VERSION nicht."
            exit 1
          }

          grep -Fq "$VERSION" changelog.md || {
            echo "changelog.md enthält Version $VERSION nicht."
            exit 1
          }

          grep -Fq "$VERSION" CHATGPT_PROJEKTKONTEXT.md || {
            echo "CHATGPT_PROJEKTKONTEXT.md enthält Version $VERSION nicht."
            exit 1
          }

          echo "Projektkontext-Prüfung erfolgreich."
