name: Performance-Indizes prüfen

on:
  pull_request:
    paths:
      - 'app/models.py'
      - 'app/db_migrations.py'
      - 'app/services/worktime.py'
      - 'app/routes/common.py'
      - 'app/services/network_security.py'
      - 'app/main.py'
      - 'tests/test_performance_indexes.py'
      - 'tests/test_worktime_calculation.py'
      - 'tests/test_status_and_network.py'
      - 'tests/test_route_duplicates.py'
      - 'tests/test_secret_key.py'
      - 'tests/test_booking_state.py'
      - 'version.txt'
  push:
    branches: [main]
    paths:
      - 'app/models.py'
      - 'app/db_migrations.py'
      - 'app/services/worktime.py'
      - 'app/routes/common.py'
      - 'app/services/network_security.py'
      - 'app/services/startup_checks.py'
      - 'app/core/config.py'
      - 'app/main.py'
      - 'app/routes/__init__.py'
      - 'app/routes/web.py'
      - 'debian/postinst'
      - 'tests/test_performance_indexes.py'
      - 'tests/test_worktime_calculation.py'
      - 'tests/test_status_and_network.py'
      - 'tests/test_route_duplicates.py'
      - 'tests/test_secret_key.py'
      - 'tests/test_booking_state.py'

jobs:
  performance-index-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Syntax prüfen
        run: |
          python -m py_compile app/models.py app/db_migrations.py app/services/worktime.py
          python -m py_compile app/routes/common.py app/services/network_security.py app/main.py
          python -m py_compile app/core/config.py app/services/startup_checks.py
          python -m py_compile app/services/booking_state.py
      - name: Performance-Tests ausführen
        run: pytest -q tests/test_performance_indexes.py tests/test_worktime_calculation.py tests/test_status_and_network.py
      - name: Doppelte Routen prüfen
        run: pytest -q tests/test_route_duplicates.py
      - name: Session-Schlüssel prüfen
        run: pytest -q tests/test_secret_key.py
      - name: Buchungszustand prüfen
        run: pytest -q tests/test_booking_state.py
      - name: Kein fester Schlüssel im Quelltext
        run: |
          ! grep -rq '^SECRET_KEY = os.environ.get' app/
          ! grep -rq 'STEMPELUHR_SECRET_KEY", "[^"]' app/
      - name: Versionsgleichheit prüfen
        run: |
          test "$(cat version.txt)" = "5.6.38"
          grep -q 'APP_VERSION = "5.6.38"' app/version.py
          grep -q '^Version: 5.6.38$' debian/control
