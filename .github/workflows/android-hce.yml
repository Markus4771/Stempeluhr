name: Android HCE APK

on:
  push:
    paths:
      - 'android-hce/**'
      - '.github/workflows/android-hce.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-hce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: stempeluhr-hce-debug-apk
          path: android-hce/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
